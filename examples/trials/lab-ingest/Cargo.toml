[package]
name = "lab-ingest"
version = "0.14.2"
edition = "2021"

[dependencies]
anyhow = "1"
aws-config = "1"
aws-sdk-s3 = "1"
aws-sdk-sns = "1"
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["postgres", "chrono", "runtime-tokio"] }
tokio = { version = "1", features = ["full"] }
