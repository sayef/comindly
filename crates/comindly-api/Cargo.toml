[package]
name = "comindly-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "comindly's API: the requests and answers of an engine's /api/v1, shared by the engine and the command line."
documentation = "https://docs.rs/comindly-api"
readme = "README.md"

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
blake3.workspace = true
chrono.workspace = true
uuid.workspace = true
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[features]
# The typed client for an engine's /api/v1, as the command line uses it.
client = ["dep:reqwest", "dep:tokio"]
