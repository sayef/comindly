[package]
name = "comindly-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "comindly as a server: the web app and API, MCP for agents, indexing jobs, members and roles."
documentation = "https://docs.rs/comindly-server"
readme = "README.md"

[dependencies]
comindly-core.workspace = true
comindly-ui.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
indicatif.workspace = true
console.workspace = true
comfy-table.workspace = true
anyhow.workspace = true
tokio-util.workspace = true
tokio.workspace = true
futures.workspace = true
git2.workspace = true
lancedb.workspace = true
rmcp.workspace = true
blake3.workspace = true
uuid.workspace = true
chacha20poly1305.workspace = true
getrandom.workspace = true
lettre.workspace = true
chrono.workspace = true
axum.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
# OTLP trace export when OTEL_EXPORTER_OTLP_ENDPOINT is set; on in the container image and Linux release builds.
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry", "dep:reqwest"]

[dev-dependencies]
tower.workspace = true
