<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f5f6" />
    <script>
      // Apply the saved or system theme before the first paint, so dark mode never flashes light.
      try {
        const t = localStorage.getItem("comindly.theme") ?? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        if (t === "dark") {
          document.documentElement.classList.add("dark");
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0e0f10");
        }
      } catch {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>comindly</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
