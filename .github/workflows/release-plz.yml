name: Release-plz

on:
  # Every push to main opens or updates the release PR; nothing is published.
  push:
    branches: [main]
  # Publishing is manual: Actions → Release-plz → Run workflow, or `gh workflow run release-plz.yml`.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Run by hand: publishes `comindly` to crates.io, tags `v*` and creates the GitHub release for the version
  # on main. The tag is pushed with GITHUB_TOKEN, so release.yml picks it up through `workflow_run`.
  release:
    if: github.repository_owner == 'sayef' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: release-plz-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # protoc from GitHub releases; cmake comes with the runner image (no Ubuntu mirror needed).
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: cmake --version
      # The crate ships the built web UI (see `include` in Cargo.toml).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci && npm run build
        working-directory: ui
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Opens or updates the release PR: version bump and CHANGELOG.md entry.
  release-pr:
    if: github.repository_owner == 'sayef' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          # A PR opened with GITHUB_TOKEN gets no CI runs; set RELEASE_PLZ_TOKEN (GitHub App or PAT) to get them.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
