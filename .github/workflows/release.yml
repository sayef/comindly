name: Release

# Builds `comindly-<target>.tar.gz` (+ `.sha256`) for each target and attaches them to the GitHub release
# that release-plz created; scripts/install.sh downloads these.
on:
  push:
    tags: ["v*"]
  # release-plz pushes its tags with GITHUB_TOKEN, which does not trigger `push`.
  workflow_run:
    workflows: [Release-plz]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish, e.g. v0.1.0
        required: false

permissions:
  contents: read

jobs:
  tag:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - id: tag
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          case "$EVENT" in
            workflow_run) tag=$(git tag --points-at HEAD --list 'v*' | sort -V | tail -n 1) ;;
            workflow_dispatch) tag=$([[ "$INPUT_TAG" == v* ]] && echo "$INPUT_TAG" || true) ;;
            *) tag=$([[ "$GITHUB_REF" == refs/tags/v* ]] && echo "$GITHUB_REF_NAME" || true) ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=${tag:-$(git rev-parse HEAD)}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${tag:-none}"

  ui:
    needs: tag
    if: needs.tag.outputs.tag != '' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci && npm run build
        working-directory: ui
      - uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: ui/dist

  build:
    needs: [tag, ui]
    if: needs.tag.outputs.tag != '' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            container: rust:1.97-bullseye # glibc 2.31: runs on Ubuntu 20.04+, Rocky 9
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            container: rust:1.97-bullseye
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest # cross-compiled on Apple Silicon
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ui/dist
      # Debian 11's security archive is retired; the build tools come from the main archive.
      - if: runner.os == 'Linux'
        run: |
          sed -i '/bullseye-security/d' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          apt-get update && apt-get install -y protobuf-compiler cmake perl
      - if: runner.os == 'macOS'
        run: brew install protobuf cmake
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          tar -C target/${{ matrix.target }}/release -czf "comindly-${{ matrix.target }}.tar.gz" comindly
          shasum -a 256 "comindly-${{ matrix.target }}.tar.gz" > "comindly-${{ matrix.target }}.tar.gz.sha256" \
            2>/dev/null || sha256sum "comindly-${{ matrix.target }}.tar.gz" > "comindly-${{ matrix.target }}.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: comindly-${{ matrix.target }}
          path: comindly-${{ matrix.target }}.tar.gz*

  publish:
    needs: [tag, build]
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          prerelease: ${{ contains(needs.tag.outputs.tag, '-') }}
          files: dist/comindly-*

  # The container image from the Linux binaries above, for amd64 and arm64, on GitHub's registry.
  image:
    needs: [tag, build]
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: comindly-*-linux-gnu
          path: artifacts
          merge-multiple: true
      - name: Unpack binaries per platform
        run: |
          for pair in x86_64:amd64 aarch64:arm64; do
            mkdir -p "dist/linux/${pair#*:}"
            tar -xzf "artifacts/comindly-${pair%%:*}-unknown-linux-gnu.tar.gz" -C "dist/linux/${pair#*:}"
          done
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.tag.outputs.tag }}
            type=raw,value=latest,enable=${{ !contains(needs.tag.outputs.tag, '-') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: local
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # The image starts and answers on both platforms.
      - name: Smoke test
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          for p in linux/amd64 linux/arm64; do
            docker run --rm --platform "$p" "ghcr.io/${{ github.repository }}:${TAG#v}" --version
          done

  # Installs the published release the way users do; fails the release if that breaks.
  verify-install:
    needs: [tag, publish]
    if: needs.tag.outputs.tag != ''
    uses: ./.github/workflows/install-check.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
