# Comindly cross-platform smoke test.
#
# Build once on an OLD glibc (portable), then run the prebuilt binary on clean distro images
# via `docker run` — the real "does it run on a fresh box" test (no Rust/protoc installed there).
# macOS is built + tested natively (containers can't cover it).
name: portability

# Expensive (full release build + many distros + macOS). Runs on release tags + manual only —
# the portability check that matters right before binaries ship, not on a nightly timer.
on:
  workflow_dispatch:
  # Right after a release PR is merged (release-plz tags with GITHUB_TOKEN, so `push: tags` never fires).
  workflow_run:
    workflows: [Release-plz]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  # ---- Linux: build a portable glibc binary, then exec it on several distros --------------
  # Only when the triggering release-plz run actually tagged a release.
  tag:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.tag.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - id: tag
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ] || git tag --points-at HEAD --list 'v*' | grep -q .; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build-linux:
    needs: tag
    if: needs.tag.outputs.release == 'true'
    runs-on: ubuntu-latest
    # Debian 11 (glibc 2.31) → binary runs on Ubuntu 20.04+, Rocky 9, Debian 11/12, etc.
    container: rust:1.97-bullseye
    steps:
      - uses: actions/checkout@v7
      # Debian 11's security archive is retired; the build tools come from the main archive.
      - run: |
          sed -i '/bullseye-security/d' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          apt-get update && apt-get install -y protobuf-compiler cmake
      - run: cargo build --release -p comindly -p comindly-engine
      - uses: actions/upload-artifact@v7
        with:
          name: comindly-linux
          path: |
            target/release/comindly
            target/release/comindly-engine

  smoke-linux:
    needs: build-linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:20.04
          - ubuntu:22.04
          - debian:12
          - rockylinux:9
        include:
          - image: alpine:3.20
            musl: true # glibc binary on musl — expected to fail until we ship a musl build
    steps:
      - uses: actions/download-artifact@v8
        with: { name: comindly-linux }
      - run: chmod +x comindly comindly-engine
      - name: Smoke test on ${{ matrix.image }}
        continue-on-error: ${{ matrix.musl == true }}
        run: |
          docker run --rm -v "$PWD":/w -w /w "${{ matrix.image }}" sh -c '
            set -e
            mkdir -p /tmp/s && printf "class A:\n  def run(self):\n    pass\n" > /tmp/s/x.py
            ./comindly --help
            ./comindly index /tmp/s --no-llm   # starts the engine beside it: tree-sitter, binary load, no network
            ./comindly find A
          '

  # ---- macOS: build + smoke on Apple Silicon; x86_64 built there too and run under Rosetta ---
  # (Intel macos-13 runners are being retired and stall in the queue.)
  build-test-macos:
    needs: tag
    if: needs.tag.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - run: brew install protobuf cmake
      - name: Ensure Rosetta (run x86_64 binary on arm)
        if: matrix.target == 'x86_64-apple-darwin'
        run: softwareupdate --install-rosetta --agree-to-license || true
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }} -p comindly -p comindly-engine
      - name: Smoke test
        run: |
          mkdir -p /tmp/s && printf 'class A:\n  def run(self):\n    pass\n' > /tmp/s/x.py
          ./target/${{ matrix.target }}/release/comindly --help
          ./target/${{ matrix.target }}/release/comindly index /tmp/s --no-llm
          ./target/${{ matrix.target }}/release/comindly find A

  # Windows is intentionally omitted for now: aws-lc-sys (BoringSSL) + vendored libgit2 on MSVC
  # need extra setup (nasm, protoc, cmake). Add a windows-latest job once those are proven.
