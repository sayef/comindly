name: Benchmarks

# Nightly when main moved since the last run, or by hand; never a gate for releases.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      # The base is the commit the last successful run measured; nothing new on main, nothing to do.
      - name: Find the last benchmarked commit
        id: last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow bench.yml --status success \
            --limit 1 --json headSha --jq '.[0].headSha // ""')
          echo "base=$base" >> "$GITHUB_OUTPUT"
          if [ "$base" = "$GITHUB_SHA" ] && [ "$GITHUB_EVENT_NAME" = schedule ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No commits since the last benchmark run." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.last.outputs.skip != 'true'
        uses: actions/checkout@v7
      - if: steps.last.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake
      - if: steps.last.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.last.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.last.outputs.skip != 'true'
        run: cargo install critcmp --locked

      # Report-only: shared runners are noisy, so regressions never fail the build.
      - name: Benchmark the base commit
        if: steps.last.outputs.skip != 'true'
        continue-on-error: true
        env:
          BASE_SHA: ${{ steps.last.outputs.base }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "$GITHUB_SHA" ]; then
            echo "No base commit to compare against."
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add "$RUNNER_TEMP/base" "$BASE_SHA"
          if [ ! -f "$RUNNER_TEMP/base/benches/graph.rs" ]; then
            echo "The base commit has no benchmarks."
            exit 0
          fi
          cd "$RUNNER_TEMP/base"
          cargo bench -p comindly-engine --bench graph -- --save-baseline base

      - name: Benchmark the head commit
        if: steps.last.outputs.skip != 'true'
        continue-on-error: true
        run: cargo bench -p comindly-engine --bench graph -- --save-baseline head

      - name: Write the comparison to the job summary
        if: always() && steps.last.outputs.skip != 'true'
        run: |
          {
            echo "## Benchmarks"
            echo
            if [ -d "$CARGO_TARGET_DIR/criterion" ] && critcmp --baselines | grep -qx base; then
              echo "Base \`base\` against head \`head\`; changes under about 5% are usually runner noise."
              echo
              echo '```'
              critcmp base head
              echo '```'
            elif [ -d "$CARGO_TARGET_DIR/criterion" ]; then
              echo '```'
              critcmp head
              echo '```'
            else
              echo "No benchmark results."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
